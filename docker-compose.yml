services:
  postgres:
    image: postgres:16-alpine
    container_name: ab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ab_testing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ab_testing"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ab_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ab_testing
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 86400
      MIN_SAMPLE_SIZE_PER_VARIANT: 100
      SIGNIFICANCE_ALPHA: 0.05
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python /app/scripts/run_migrations.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: ab_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
